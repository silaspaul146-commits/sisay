[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-platform-backend"
version = "0.1.0"
description = "Crisis Safety and Humanitarian Intelligence Platform: FastAPI modular monolith"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL + PostGIS (set TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py314"
