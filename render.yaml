# Render Blueprint: API web service + background worker, both from backend/Dockerfile.
# Database: Neon (not Render Postgres). Connection strings are entered in the Render dashboard
# (sync: false) and never committed. See docs/DEPLOY.md.
envVarGroups:
  - name: crisis-shared
    envVars:
      - key: APP_ENV
        value: staging
      # HMAC pepper for anonymous report tokens. Generated once by Render.
      # NEVER regenerate it: every existing report token would stop working.
      - key: TOKEN_PEPPER
        generateValue: true

services:
  - type: web
    name: crisis-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: ohio               # must match the Neon region (aws-us-east-2)
    plan: starter              # preDeployCommand needs a paid plan
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeploy: true
    envVars:
      - fromGroup: crisis-shared
      - key: DATABASE_URL            # app_citizen role, Neon pooled endpoint (-pooler) is fine
        sync: false
      - key: PUBLIC_DATABASE_URL     # app_public role
        sync: false
      - key: MIGRATION_DATABASE_URL  # owner role, Neon DIRECT endpoint (no -pooler)
        sync: false

  # Staff review dashboard: static files, free, never sleeps. Values are public (browser bundle).
  - type: web
    name: sisay-review
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://sisay.onrender.com/api/v1
      - key: NEXT_PUBLIC_AUTH0_AUDIENCE
        value: https://sisay.onrender.com/api
      - key: NEXT_PUBLIC_AUTH0_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_AUTH0_CLIENT_ID
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://sisay.onrender.com https://*.auth0.com; frame-src https://*.auth0.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: worker
    name: crisis-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    region: ohio
    plan: starter
    autoDeploy: true
    envVars:
      - fromGroup: crisis-shared
      - key: DATABASE_URL            # app_worker role; worker derives the direct endpoint for LISTEN
        sync: false
